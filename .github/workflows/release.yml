  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rustyspectral-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: RustySpectral ${{ github.ref_name }}

          generate_release_notes: true

          body: |
            ## RustySpectral ${{ github.ref_name }}

            Rust port of pyspectral — satellite sensor spectral response & solar spectrum analysis.

            ### Included binaries

            - `download_rsr` — Download RSR data from Zenodo
            - `download_atm_correction_luts` — Download atmospheric correction LUTs

            ### Installation

            Extract the archive for your platform and run the binaries.

            First-time users should run both download tools to fetch required static data.

            ```bash
            ./download_rsr
            ./download_atm_correction_luts
            ```

            ### Library usage

            Add to `Cargo.toml`:

            ```toml
            [dependencies]
            rustyspectral = "${{ github.ref_name }}"
            ```

            See [README](https://github.com/anomalyco/RustySpectral#readme) for full documentation.

          draft: false

          prerelease: ${{ contains(github.ref_name, '-') }}

          files: artifacts/*

          token: ${{ secrets.GITHUB_TOKEN }}