name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            suffix: linux-aarch64

          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-aarch64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/download_rsr release/
          cp target/${{ matrix.target }}/release/download_atm_correction_luts release/
          cp README.md release/
          cp -r data release/
          tar -czf rustyspectral-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz release/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir -Force release
          Copy-Item target/${{ matrix.target }}/release/download_rsr.exe release/
          Copy-Item target/${{ matrix.target }}/release/download_atm_correction_luts.exe release/
          Copy-Item README.md release/
          Copy-Item -Recurse data release/
          Compress-Archive -Path release/* -DestinationPath rustyspectral-${{ github.ref_name }}-${{ matrix.suffix }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustyspectral-${{ matrix.suffix }}
          path: rustyspectral-${{ github.ref_name }}-${{ matrix.suffix }}.*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rustyspectral-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: RustySpectral ${{ github.ref_name }}
          body: |
            ## RustySpectral ${{ github.ref_name }}

            Rust port of pyspectral — satellite sensor spectral response & solar spectrum analysis.

            ### Included binaries
            - `download_rsr` — Download RSR data from Zenodo
            - `download_atm_correction_luts` — Download atmospheric correction LUTs

            ### Installation
            Extract the archive for your platform and run the binaries.
            First-time users should run both download tools to fetch required static data.

            ```bash
            ./download_rsr
            ./download_atm_correction_luts
            ```

            ### Library usage
            Add to `Cargo.toml`:
            ```toml
            [dependencies]
            rustyspectral = "${{ github.ref_name }}"
            ```

            See [README](https://github.com/anomalyco/RustySpectral#readme) for full documentation.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}
