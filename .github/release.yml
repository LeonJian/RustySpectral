changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"

    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"

    - title: "⚡ Performance"
      labels:
        - "performance"
        - "optimization"

    - title: "📡 Satellite / Remote Sensing"
      labels:
        - "satellite"
        - "calibration"
        - "sensor"

    - title: "📚 Documentation"
      labels:
        - "documentation"
        - "docs"

    - title: "🔧 Maintenance"
      labels:
        - "dependencies"
        - "refactor"
        - "chore"

    - title: "⚠️ Breaking Changes"
      labels:
        - "breaking-change"

    - title: "Other Changes"
      labels:
        - "*"